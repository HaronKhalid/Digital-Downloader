name: Build & Release Digital Downloader (Desktop & Mobile)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Quality & Unit Tests
  # -------------------------------------------------------------
  test:
    name: Test & Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest Suite
        run: |
          pytest -v

  # -------------------------------------------------------------
  # 2. Build Windows Desktop App (.exe + zip)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop App
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Install Bundled FFmpeg Binaries
        run: |
          python scripts/install_ffmpeg.py

      - name: Build Windows Executable & Package
        run: |
          python scripts/package_app.py

      - name: Build Windows Installer (Inno Setup)
        run: |
          choco install innosetup -y
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\iscc.exe",
            "C:\ProgramData\chocolatey\lib\innosetup\tools\ISCC.exe",
            "C:\tools\InnoSetup\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup*", "C:\Program Files\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          Write-Host "Using ISCC compiler at: $iscc"
          & "$iscc" installer.iss
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDownloader-windows-x64
          path: |
            dist/DigitalDownloader-Setup.exe
            dist/DigitalDownloader.exe
            dist/DigitalDownloader-windows-x64.zip
          retention-days: 14

  # -------------------------------------------------------------
  # 3. Build Android Mobile App (APK)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Mobile APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Web Assets to Android Project
        run: |
          python scripts/sync_android_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle wrapper
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace
          # Also try assembleRelease (generates unsigned release apk)
          ./gradlew assembleRelease --stacktrace || true

      - name: Sign & Package Android APK
        run: |
          mkdir -p release-apks
          keytool -genkey -v -keystore release.keystore -alias digitaldownloader -keyalg RSA -keysize 2048 -validity 10000 -storepass digitaldownloader123 -keypass digitaldownloader123 -dname "CN=Digital Downloader, OU=Digital Takhleeq, O=Digital Takhleeq, L=San Francisco, ST=CA, C=US"
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"
          
          SRC_APK=""
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            SRC_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            SRC_APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "Signing source APK: $SRC_APK"
          
          $APKSIGNER sign --ks release.keystore --ks-pass pass:digitaldownloader123 --key-pass pass:digitaldownloader123 --out release-apks/DigitalDownloader.apk "$SRC_APK"
          $APKSIGNER verify --verbose release-apks/DigitalDownloader.apk

          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/DigitalDownloader-debug.apk
          fi
          ls -la release-apks/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDownloader-android-apks
          path: release-apks/*.apk
          retention-days: 14

  # -------------------------------------------------------------
  # 4. Build Linux Standalone App
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux Desktop Standalone
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Build Linux Standalone Binary
        run: |
          python scripts/package_linux.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDownloader-linux-x64
          path: dist/DigitalDownloader-linux-x64
          retention-days: 14

  # -------------------------------------------------------------
  # 5. GitHub Release (Published on Tags, Main Branch, or Dispatch)
  # -------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android, build-linux]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DigitalDownloader-windows-x64
          path: release-assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DigitalDownloader-android-apks
          path: release-assets/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: DigitalDownloader-linux-x64
          path: release-assets/

      - name: List Release Files
        run: ls -la release-assets/

      - name: Determine Tag Name
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v2.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Digital Downloader ${{ steps.get_tag.outputs.TAG_NAME }}"
          make_latest: true
          body: |
            ### 🚀 Digital Downloader v2

            Cross-platform standalone media downloader for Windows, Android, and Linux.

            #### 📦 Downloads:
            - **Windows Installer**: `DigitalDownloader-Setup.exe` (One-click installer wizard with Start Menu & Desktop shortcuts)
            - **Windows Portable**: `DigitalDownloader-windows-x64.zip` (Dedicated native desktop application window, all engines bundled)
            - **Android APK**: `DigitalDownloader.apk` (Standalone on-device mobile app, no PC server required)
            - **Linux Standalone**: `DigitalDownloader-linux-x64` (Standalone executable)

            #### ✨ Key Features:
            - **Standalone**: No manual Python or FFmpeg installation required.
            - **Universal Mode**: Automatic support for all media sources out-of-the-box.
            - **Quality Selection**: Pick from maximum 4K/1080p resolution down to 144p or audio only.
            - **Android Share Target**: Share videos directly from TikTok, Instagram, or YouTube into Digital Downloader.
            - **Live Progress & History**: Real-time progress bar, speed, ETA, and download history.
          files: release-assets/*
          draft: false
          prerelease: false
