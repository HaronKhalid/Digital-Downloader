plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.digitaldownloader.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.digitaldownloader.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.1.0"

        // The on-device engine ships Python + FFmpeg per CPU type. 64-bit and 32-bit ARM cover
        // practically every phone; x86 emulators are not supported by the release build.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // The engine runs its bundled programs from the installed native libraries,
    // so they must be extracted to disk at install time.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
            // Not signed here on purpose: CI signs the release with the key from GitHub Secrets.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // On-device yt-dlp (with Python and QuickJS) and FFmpeg.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
